    - assets/pets/cat/v2/
    - assets/pets/cat/v3/
    - assets/pets/cat/cat_astronaut/
    - assets/pets/cat/cat_princess/
    - assets/pets/cat/cat_detective/
    - assets/pets/dog/v1/
    - assets/pets/dog/v2/
    - assets/pets/dog/v3/
    - assets/pets/dog/dog_firefighter/
    - assets/pets/dog/dog_football/
    - assets/pets/dog/dog_chef/
    - assets/pets/penguin/v1/
    - assets/pets/penguin/v2/
    - assets/pets/penguin/v3/
    - assets/pets/penguin/penguin_sailor/
    - assets/pets/penguin/penguin_scientist/
    - assets/pets/penguin/penguin_rockstar/
