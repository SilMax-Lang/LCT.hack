name: finny_pet
description: Финни — детский финансовый питомец (7–10+ лет). Онбординг, питомец, бюджет, задания, магазин, копилка.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
