name: finny_pet
description: Финни — детский финансовый питомец (7–10+ лет). Онбординг, питомец, бюджет, задания, магазин, копилка.
publish_to: 'none'
version: 0.5.0+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/finny.jpg
    # Анимированные модели для PetView: ролики, постеры, pet.json.
    - assets/pets/cat_ginger_small/
    - assets/pets/cat_ginger_medium/
    - assets/pets/cat_ginger_large/
    - assets/pets/cat_gray_small/
    - assets/pets/cat_gray_medium/
    - assets/pets/cat_gray_large/
    - assets/pets/cat_black_small/
    - assets/pets/cat_black_medium/
    - assets/pets/cat_black_large/
    - assets/pets/dog_ginger_small/
    - assets/pets/dog_ginger_medium/
    - assets/pets/dog_ginger_large/
    - assets/pets/dog_gray_small/
    - assets/pets/dog_gray_medium/
    - assets/pets/dog_gray_large/
    - assets/pets/dog_black_small/
    - assets/pets/dog_black_medium/
    - assets/pets/dog_black_large/
    # Аксессуары поверх питомца (PNG), см. lib/pet/pet_view.dart.
    - assets/accessories/
