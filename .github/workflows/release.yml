name: Release APK

# Тег v* (например v0.2.0) — собрать release APK и выложить его
# в GitHub Releases. Можно запустить и вручную с вкладки Actions.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза, например v0.2.0"
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Tests
        run: flutter test

      # Релизный ключ — из секретов репозитория (в git его нет). Если
      # секреты не заданы, сборка подписывается debug-ключом.
      - name: Release keystore
        env:
          KEYSTORE_B64: ${{ secrets.FINNY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/finny.jks"
            echo "FINNY_KEYSTORE=$RUNNER_TEMP/finny.jks" >> "$GITHUB_ENV"
          else
            echo "Секрет FINNY_KEYSTORE_BASE64 не задан — подпись debug-ключом"
          fi

      - name: Build release APK and AAB
        env:
          FINNY_KEYSTORE_PASSWORD: ${{ secrets.FINNY_KEYSTORE_PASSWORD }}
          FINNY_KEY_ALIAS: ${{ secrets.FINNY_KEY_ALIAS }}
          FINNY_KEY_PASSWORD: ${{ secrets.FINNY_KEY_PASSWORD }}
        run: |
          flutter build apk --release
          flutter build appbundle --release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "finny-$TAG.apk"
          cp build/app/outputs/bundle/release/app-release.aab "finny-$TAG.aab"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "finny-$TAG.apk" "finny-$TAG.aab" --clobber
          else
            gh release create "$TAG" "finny-$TAG.apk" "finny-$TAG.aab" \
              --target "$GITHUB_SHA" \
              --title "Финни $TAG" \
              --notes "Android APK для установки: скачайте finny-$TAG.apk, разрешите установку из неизвестных источников и откройте файл. Приложение работает офлайн."
          fi
